<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="brand">Codex</a>

    <h1>Welcome back</h1>
    <p>Log in to manage your projects and tasks.</p>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <form (ngSubmit)="submit()">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required>

      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="switch">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
